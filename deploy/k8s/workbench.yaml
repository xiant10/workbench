# Two stateless replicas in the t10 namespace. Migrations take an advisory lock,
# so both can start at once. The secret holds DATABASE_URL, AUTH_CLIENT_SECRET and
# WORKBENCH_SESSION_KEY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
  namespace: t10
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbench
        # Lets these pods through auth-server's network policy.
        t10.dev/auth-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workbench
          image: t10-workbench:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18060
          env:
            - name: WORKBENCH_LISTEN_ADDR
              value: ":18060"
            - name: WORKBENCH_PUBLIC_URL
              value: https://workbench.example.com
            - name: AUTH_PUBLIC_URL
              value: https://auth.example.com
            - name: AUTH_URL
              value: http://auth-server.t10.svc.cluster.local:18000
            # ai-gateway-agent, which finds each session's replica.
            - name: AGENT_URLS
              value: assistant=http://ai-gateway-agent.t10.svc.cluster.local:18090
            - name: MODULE_URLS
              value: collab=http://t10-collab.t10.svc.cluster.local:18040,agents=http://t10-agent-control.t10.svc.cluster.local:18010,knowledge=http://t10-knowledge.t10.svc.cluster.local:18050
            # Business apps: one key per module in workbench-modules, added by
            # each module's own component. Reread while running.
            - name: MODULES_DIR
              value: /etc/workbench/modules
          envFrom:
            - secretRef:
                name: workbench
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18060
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18060
          volumeMounts:
            - name: modules
              mountPath: /etc/workbench/modules
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: modules
          configMap:
            name: workbench-modules
---
# Empty here: a business module's component merges in a key named by its ID,
# holding its address. No hash suffix, so a change reaches running pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-modules
  namespace: t10
---
apiVersion: v1
kind: Service
metadata:
  name: workbench
  namespace: t10
spec:
  selector:
    app.kubernetes.io/name: workbench
  ports:
    - port: 18060
